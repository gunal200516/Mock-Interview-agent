services:
  - type: web
    name: mock-interview-agent
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mock-interview-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://mock-interview-agent.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
    autoDeploy: true

databases:
  - name: mock-interview-db
    databaseName: mock_interview_agent
    user: mock_interview_user
    region: oregon
    plan: free